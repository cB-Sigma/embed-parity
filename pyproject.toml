[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "embed-parity"
dynamic = ["version"]
description = "Check that an embedding or rerank server returns what the reference library returns, and diagnose why when it does not."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The embed-parity Authors" }]
keywords = [
  "embeddings",
  "rerank",
  "sentence-transformers",
  "conformance",
  "parity",
  "vllm",
  "text-embeddings-inference",
  "retrieval",
  "testing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Needed only to *compute* a reference from a real model. Checking an endpoint
# against an existing reference file needs numpy and nothing else.
reference = ["sentence-transformers>=3.0", "torch>=2.0"]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/cb-Sigma/embed-parity"
Documentation = "https://github.com/cb-Sigma/embed-parity/tree/main/docs"
Issues = "https://github.com/cb-Sigma/embed-parity/issues"
Changelog = "https://github.com/cb-Sigma/embed-parity/blob/main/CHANGELOG.md"

[project.scripts]
embed-parity = "embed_parity.cli:main"

[tool.hatch.version]
path = "src/embed_parity/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/embed_parity"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "N"]
ignore = ["N803", "N806"] # matrix names such as E, B are conventional here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/embed_parity"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "real_model: needs the 'reference' extra and a downloadable Hugging Face model (set EMBED_PARITY_REAL_MODEL=1)",
]

[tool.coverage.run]
source = ["embed_parity"]
branch = true
